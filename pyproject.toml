# Hand-written packaging for the Jira coda. The code itself lives in gen/python and is
# regenerated by Codapact (see codapact.yaml); release-please bumps the version here only.
[project]
name = "codapact-jira"
version = "0.0.0"
description = "Typed Python client and `codapact-jira` CLI for the Jira Cloud platform REST API v3, with Markdown rich text, generated by Codapact"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Hill" }]
requires-python = ">=3.13"
dependencies = ["codapact[keyring,browser]>=0.17.3,<0.18", "adflux>=0.4.0,<0.5"]
keywords = ["jira", "atlassian", "markdown", "adf", "cli", "api-client", "codapact"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
codapact-jira = "codapact_jira.cli:main"

[project.urls]
Homepage = "https://github.com/mikejhill/codapact-jira"
Repository = "https://github.com/mikejhill/codapact-jira"
Issues = "https://github.com/mikejhill/codapact-jira/issues"
Generator = "https://github.com/mikejhill/codapact"

[dependency-groups]
dev = ["codapact[keyring,browser]==0.17.3", "pytest>=8"]

[tool.uv.build-backend]
module-name = "codapact_jira"
module-root = "gen/python/src"
source-include = ["gen/python/tests/**", "codapact.yaml", "openapi.json", "handlers/**", "tests/**"]

[tool.pytest.ini_options]
testpaths = ["gen/python/tests", "tests"]

[build-system]
requires = ["uv_build>=0.11.1,<0.14"]
build-backend = "uv_build"
